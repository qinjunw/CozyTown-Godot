name: Windows toolchain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check delivery commands with offline fixtures
        run: |
          python tools/windows/test-ci-release.py
          if ($LASTEXITCODE -ne 0) { throw 'CI release command checks failed.' }
          python tools/windows/test-delivery.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows delivery checks failed.' }
          python tools/windows/test-final-review-gate.py
          if ($LASTEXITCODE -ne 0) { throw 'Final review preflight checks failed.' }
      - name: Install pinned portable tools
        run: ./tools/windows/install-toolchain.ps1
      - name: Check model probe with offline fixtures
        run: |
          & ./.local/tools/dotnet/dotnet.exe run --project tools/experiments/CozyTown.ModelProbe --configuration Release -- --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Model probe offline checks failed.' }
      - name: Build, test, and run the Windows export
        id: verification
        run: ./tools/windows/verify.ps1
      - name: Package Windows candidate
        id: candidate
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.verification.outcome == 'success'
        env:
          CI_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          ./tools/windows/delivery.ps1 -Mode Package -VerificationRoot artifacts/verification -PackageRoot artifacts/windows-candidate -Repository $env:GITHUB_REPOSITORY -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -SourceCommit $env:CI_SOURCE_COMMIT
      - name: Upload Windows candidate
        if: success() && steps.candidate.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/windows-candidate/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  verify-fork:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check delivery commands with offline fixtures
        run: |
          python tools/windows/test-ci-release.py
          if ($LASTEXITCODE -ne 0) { throw 'CI release command checks failed.' }
          python tools/windows/test-delivery.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows delivery checks failed.' }
          python tools/windows/test-final-review-gate.py
          if ($LASTEXITCODE -ne 0) { throw 'Final review preflight checks failed.' }
      - name: Install pinned portable tools
        run: ./tools/windows/install-toolchain.ps1
      - name: Check model probe with offline fixtures
        run: |
          & ./.local/tools/dotnet/dotnet.exe run --project tools/experiments/CozyTown.ModelProbe --configuration Release -- --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Model probe offline checks failed.' }
      - name: Build, test, and run the Windows export
        run: ./tools/windows/verify.ps1
