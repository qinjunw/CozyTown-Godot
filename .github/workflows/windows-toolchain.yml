name: Windows toolchain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned portable tools
        run: ./tools/windows/install-toolchain.ps1
      - name: Build, test, and run the Windows export
        run: ./tools/windows/verify.ps1
      - name: Upload export and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-toolchain-${{ github.sha }}
          path: artifacts/verification/
          retention-days: 14
